# Synthetic Enterprise Configuration Artifact
[security]
enforce_mfa = true
max_failed_logins = 5
lockout_duration_sec = 900
allow_root_ssh = false
session_timeout = 3600

[network]
listen_interface = "10.0.1.1"
trusted_proxies = ["10.0.1.254"]
allowed_ports = [22, 443, 8443]

[audit]
log_level = "DEBUG"
forwarding_syslog = "10.0.1.50:514"
hash_verification = "SHA256"
